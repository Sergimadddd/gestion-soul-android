name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf app-src
          mkdir -p app-src
          unzip -q Gestion-Soul-Android-Offline.zip -d app-src
          echo "Contenido extraído:"
          find app-src -maxdepth 3 -type f | sort | head -200

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e
          PROJECT_DIR="$(find app-src -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -1 | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No se encontró settings.gradle(.kts) dentro del proyecto extraído."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Gradle: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Compatibility patch for AGP 9 built-in Kotlin
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          sed -n '1,80p' app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s2 = s.replace('    alias(libs.plugins.kotlin.android)\n', '')
          s2 = s2.replace('    id("org.jetbrains.kotlin.android")\n', '')
          if s2 == s:
              print("No se encontró la línea del plugin Kotlin; no se modifica el archivo.")
          else:
              p.write_text(s2)
              print("Plugin Kotlin eliminado para compatibilidad con AGP 9.")
          PY
          sed -n '1,40p' app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p release
          find "$PROJECT_DIR" -type f -name "*.apk" -print -exec cp {} release/ \;
          if ! find release -type f -name "*.apk" | grep -q .; then
            echo "::error::La compilación terminó pero no se encontró ningún APK."
            exit 1
          fi
          ls -lh release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-soul-android-apk
          path: release/*.apk
          if-no-files-found: error
